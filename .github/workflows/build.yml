name: Build & Validate

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  PLUGINVAL_VERSION: v1.0.4
  CLAP_VALIDATOR_VERSION: "0.3.2"
  ART: build/NovaPitch_artefacts/Release

jobs:
  # ---------------------------------------------------------------------------
  # Windows x64 — primary target: FL Studio for Windows (VST3 + CLAP)
  # ---------------------------------------------------------------------------
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      # No explicit generator version: windows-latest images move to newer Visual
      # Studio releases; CMake picks the newest installed one.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Host test (VST3, FL-like scenarios)
        shell: bash
        run: |
          HT=$(find build/tools -name 'NovaPitchHostTest.exe' -type f | head -1)
          "$HT" "$ART/VST3/NovaPitch.vst3" --editor

      - name: CPU benchmark
        shell: bash
        run: |
          BENCH=$(find build/tools -name 'NovaPitchBench.exe' -type f | head -1)
          "$BENCH" | tee bench.txt
          { echo '### CPU benchmark (Windows x64)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: UI snapshots
        shell: bash
        run: |
          SNAP=$(find build/tools -name 'NovaPitchSnapshot.exe' -type f | head -1)
          "$SNAP" snapshots

      - name: Download validators
        shell: bash
        run: |
          mkdir -p tools/bin && cd tools/bin
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
          unzip -oq pluginval.zip
          curl -sSL -o clapval.zip "https://github.com/free-audio/clap-validator/releases/download/${CLAP_VALIDATOR_VERSION}/clap-validator-${CLAP_VALIDATOR_VERSION}-windows.zip"
          unzip -oq clapval.zip
          find . -maxdepth 3 -name '*.exe'

      - name: pluginval (VST3, strictness 10)
        shell: bash
        run: |
          ./tools/bin/pluginval.exe --strictness-level 10 --validate-in-process --verbose \
            --output-dir pluginval-logs --validate "$ART/VST3/NovaPitch.vst3"

      - name: clap-validator
        shell: bash
        run: |
          CLAPVAL=$(find tools/bin -name 'clap-validator.exe' | head -1)
          "$CLAPVAL" validate "$ART/CLAP/NovaPitch.clap"

      - name: User guide (HTML)
        shell: pwsh
        run: |
          python -m venv .venv-docs
          .venv-docs\Scripts\python -m pip install --quiet markdown
          .venv-docs\Scripts\python tools\docs\build_guide.py docs\USER_GUIDE_es.md build\Guia_de_usuario.html

      # Phase 10: installer built, installed silently like a user, the installed
      # VST3 checked with the host test, then uninstalled.
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $version = (Select-String -Path CMakeLists.txt -Pattern 'project\(NovaPitch VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$version" "/DArtefactsDir=$PWD\build\NovaPitch_artefacts\Release" "/DDocsDir=$PWD\build" "/DOutputDir=$PWD\dist" installer\windows\NovaPitch.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Install like a user, test the installed plugin, uninstall
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist\NovaPitch-*-Setup.exe | Select-Object -First 1
          $p = Start-Process -FilePath $setup.FullName -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/LOG=install.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content install.log; exit 1 }
          $vst3 = "$env:CommonProgramFiles\VST3\NovaPitch.vst3"
          $clap = "$env:CommonProgramFiles\CLAP\NovaPitch.clap"
          $app = "$env:ProgramFiles\NovaPitch\NovaPitch.exe"
          $guide = "$env:ProgramFiles\NovaPitch\Guia_de_usuario.html"
          foreach ($f in @($vst3, $clap, $app, $guide)) { if (-not (Test-Path $f)) { Write-Error "missing $f"; exit 1 } else { Write-Host "installed: $f" } }
          $ht = Get-ChildItem -Recurse build\tools -Filter NovaPitchHostTest.exe | Select-Object -First 1
          & $ht.FullName $vst3
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Start-Process -FilePath "$env:ProgramFiles\NovaPitch\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait
          for ($i = 0; $i -lt 60 -and ((Test-Path $vst3) -or (Test-Path $clap) -or (Test-Path $app)); $i++) { Start-Sleep -Seconds 1 }
          foreach ($f in @($vst3, $clap, $app)) { if (Test-Path $f) { Write-Error "not removed: $f"; exit 1 } }
          Write-Host "uninstalled cleanly"

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: NovaPitch-Windows-x64-Setup
          path: dist/NovaPitch-*-Setup.exe
          if-no-files-found: error

      - name: Upload artefacts
        uses: actions/upload-artifact@v5
        with:
          name: NovaPitch-Windows-x64
          path: |
            ${{ env.ART }}/VST3/NovaPitch.vst3
            ${{ env.ART }}/CLAP/NovaPitch.clap
            ${{ env.ART }}/Standalone/NovaPitch.exe
            tools/install_plugins.ps1
          if-no-files-found: error

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v5
        with:
          name: UI-snapshots-Windows
          path: snapshots/*.png

  # ---------------------------------------------------------------------------
  # macOS Universal (arm64 + x86_64) — FL Studio for Mac (VST3 + AU + CLAP),
  # native on Apple Silicon and on Intel / Rosetta.
  # ---------------------------------------------------------------------------
  macos:
    name: macOS Universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"

      - name: Build
        run: cmake --build build --config Release --parallel "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure

      - name: CPU benchmark
        run: |
          BENCH=$(find build/tools -name NovaPitchBench -type f -perm -u+x | head -1)
          "$BENCH" | tee bench.txt
          { echo '### CPU benchmark (macOS)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: UI snapshots
        run: |
          SNAP=$(find build/tools -name NovaPitchSnapshot -type f -perm -u+x | head -1)
          "$SNAP" snapshots

      - name: Verify Universal Binary
        run: |
          for bin in \
            "$ART/VST3/NovaPitch.vst3/Contents/MacOS/NovaPitch" \
            "$ART/AU/NovaPitch.component/Contents/MacOS/NovaPitch" \
            "$ART/CLAP/NovaPitch.clap/Contents/MacOS/NovaPitch"; do
            archs=$(lipo -archs "$bin")
            echo "$bin: $archs"
            [[ "$archs" == *arm64* && "$archs" == *x86_64* ]] || { echo "Not universal!"; exit 1; }
          done

      - name: Ad-hoc code sign
        run: |
          for b in "$ART/VST3/NovaPitch.vst3" "$ART/AU/NovaPitch.component" "$ART/CLAP/NovaPitch.clap" "$ART/Standalone/NovaPitch.app"; do
            codesign --force --deep --sign - "$b"
            codesign --verify --verbose "$b"
          done

      - name: Download validators
        run: |
          mkdir -p tools/bin && cd tools/bin
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
          unzip -oq pluginval.zip
          curl -sSL "https://github.com/free-audio/clap-validator/releases/download/${CLAP_VALIDATOR_VERSION}/clap-validator-${CLAP_VALIDATOR_VERSION}-macos-universal.tar.gz" | tar xz
          find . -maxdepth 4 -type f \( -name pluginval -o -name clap-validator \)

      - name: auval (AU)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$ART/AU/NovaPitch.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -a | grep -i novapitch || true
          auval -strict -v aumf Npc1 Nvpt

      - name: Host test (VST3 + AU, FL-like scenarios)
        run: |
          HT=$(find build/tools -name NovaPitchHostTest -type f -perm -u+x | head -1)
          "$HT" "$ART/VST3/NovaPitch.vst3" --editor
          "$HT" ~/Library/Audio/Plug-Ins/Components/NovaPitch.component --editor

      - name: pluginval (VST3 + AU, strictness 10)
        run: |
          PV=tools/bin/pluginval.app/Contents/MacOS/pluginval
          $PV --strictness-level 10 --validate-in-process --verbose --output-dir pluginval-logs \
            --validate "$ART/VST3/NovaPitch.vst3"
          $PV --strictness-level 10 --validate-in-process --verbose --output-dir pluginval-logs \
            --validate ~/Library/Audio/Plug-Ins/Components/NovaPitch.component

      - name: clap-validator
        run: |
          CLAPVAL=$(find tools/bin -type f -name clap-validator | head -1)
          "$CLAPVAL" validate "$ART/CLAP/NovaPitch.clap"

      - name: Package (keeps bundle permissions and signatures)
        run: |
          mkdir -p dist/NovaPitch-macOS-Universal
          cp -R "$ART/VST3/NovaPitch.vst3" "$ART/AU/NovaPitch.component" \
                "$ART/CLAP/NovaPitch.clap" "$ART/Standalone/NovaPitch.app" \
                tools/install_plugins.sh dist/NovaPitch-macOS-Universal/
          ditto -c -k --keepParent dist/NovaPitch-macOS-Universal dist/NovaPitch-macOS-Universal.zip

      - name: User guide (HTML)
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install --quiet markdown
          .venv-docs/bin/python tools/docs/build_guide.py docs/USER_GUIDE_es.md build/Guia_de_usuario.html

      # Phase 10: .pkg built (Developer ID signing / notarization only when the
      # secrets exist), installed like a user, installed plugins validated.
      - name: Installer (.pkg)
        env:
          DEVELOPER_ID_APP: ${{ secrets.DEVELOPER_ID_APP }}
          DEVELOPER_ID_INSTALLER: ${{ secrets.DEVELOPER_ID_INSTALLER }}
          NOTARY_PROFILE: ${{ secrets.NOTARY_PROFILE }}
        run: |
          VERSION=$(sed -n 's/^project(NovaPitch VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          installer/macos/build_pkg.sh "$ART" "$VERSION" build/Guia_de_usuario.html dist

      - name: Install the .pkg like a user and test the installed plugins
        run: |
          rm -rf ~/Library/Audio/Plug-Ins/Components/NovaPitch.component
          sudo installer -pkg dist/NovaPitch-*-macOS.pkg -target /
          for b in /Library/Audio/Plug-Ins/VST3/NovaPitch.vst3 /Library/Audio/Plug-Ins/Components/NovaPitch.component \
                   /Library/Audio/Plug-Ins/CLAP/NovaPitch.clap /Applications/NovaPitch.app; do
            test -d "$b" || { echo "missing $b"; exit 1; }
            codesign --verify --strict "$b"
            echo "installed: $b"
          done
          test -f "/Library/Application Support/NovaPitch/Guia_de_usuario.html"
          killall -9 AudioComponentRegistrar || true
          sleep 2
          auval -strict -v aumf Npc1 Nvpt
          HT=$(find build/tools -name NovaPitchHostTest -type f -perm -u+x | head -1)
          "$HT" /Library/Audio/Plug-Ins/VST3/NovaPitch.vst3
          "$HT" /Library/Audio/Plug-Ins/Components/NovaPitch.component

      - name: Upload installer
        uses: actions/upload-artifact@v5
        with:
          name: NovaPitch-macOS-Installer
          path: dist/NovaPitch-*-macOS.pkg
          if-no-files-found: error

      - name: Upload artefacts
        uses: actions/upload-artifact@v5
        with:
          name: NovaPitch-macOS-Universal
          path: dist/NovaPitch-macOS-Universal.zip
          if-no-files-found: error

      - name: Upload UI snapshots
        uses: actions/upload-artifact@v5
        with:
          name: UI-snapshots-macOS
          path: snapshots/*.png

  # ---------------------------------------------------------------------------
  # Linux x64 — optional target, cheap early warning for build/test breakage.
  # ---------------------------------------------------------------------------
  linux:
    name: Linux x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libx11-dev libxrandr-dev libxcursor-dev \
            libxinerama-dev libxext-dev libfreetype-dev libfontconfig1-dev libgl1-mesa-dev xvfb

      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Host test (VST3, FL-like scenarios)
        run: |
          HT=$(find build/tools -name NovaPitchHostTest -type f -perm -u+x | head -1)
          xvfb-run -a "$HT" "$ART/VST3/NovaPitch.vst3" --editor

      - name: CPU benchmark
        run: |
          ./build/tools/NovaPitchBench | tee bench.txt
          { echo '### CPU benchmark (Linux x64)'; echo '```'; cat bench.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Audio demo (render + pitch plot)
        run: |
          python3 -m pip install --quiet numpy matplotlib
          ./tools/demo/run_demo.sh build demo-out
          { echo '### Audio demo: desviación respecto a la escala'; echo '```'; cat demo-out/resumen.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload audio demo
        uses: actions/upload-artifact@v5
        with:
          name: Audio-demo
          path: |
            demo-out/*.wav
            demo-out/*.png
            demo-out/resumen.txt

      - name: Download validators
        run: |
          mkdir -p tools/bin && cd tools/bin
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Linux.zip"
          unzip -oq pluginval.zip
          curl -sSL "https://github.com/free-audio/clap-validator/releases/download/${CLAP_VALIDATOR_VERSION}/clap-validator-${CLAP_VALIDATOR_VERSION}-ubuntu-18.04.tar.gz" | tar xz

      - name: pluginval (VST3, strictness 10)
        run: |
          xvfb-run -a ./tools/bin/pluginval --strictness-level 10 --validate-in-process --verbose \
            --output-dir pluginval-logs --validate "$ART/VST3/NovaPitch.vst3"

      - name: clap-validator
        run: |
          CLAPVAL=$(find tools/bin -type f -name clap-validator | head -1)
          xvfb-run -a "$CLAPVAL" validate "$ART/CLAP/NovaPitch.clap"

      - name: Package
        run: |
          python3 -m venv .venv-docs
          .venv-docs/bin/python -m pip install --quiet markdown
          .venv-docs/bin/python tools/docs/build_guide.py docs/USER_GUIDE_es.md build/Guia_de_usuario.html
          mkdir -p dist/NovaPitch-Linux-x64
          cp -R "$ART/VST3/NovaPitch.vst3" "$ART/CLAP/NovaPitch.clap" "$ART/Standalone/NovaPitch" \
                tools/install_plugins.sh build/Guia_de_usuario.html THIRD_PARTY_LICENSES.md dist/NovaPitch-Linux-x64/
          tar -C dist -czf dist/NovaPitch-Linux-x64.tar.gz NovaPitch-Linux-x64

      - name: Upload artefacts
        uses: actions/upload-artifact@v5
        with:
          name: NovaPitch-Linux-x64
          path: dist/NovaPitch-Linux-x64.tar.gz
          if-no-files-found: error
